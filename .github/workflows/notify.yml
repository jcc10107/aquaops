# Scheduled push-notification check. This project has no Cloud Functions
# (needs a paid Blaze plan), so this workflow stands in as the server-side
# trigger — it runs scripts/notify_check.mjs on a timer instead of reacting
# instantly to a Firestore write. See that script for what it checks.
#
# Requires these repository secrets (Settings > Secrets and variables >
# Actions):
#   FIREBASE_API_KEY        - the Web API key from firebase_options.dart
#   BACKUP_ACCOUNT_EMAIL    - owner@aquaops.com (or a dedicated account)
#   BACKUP_ACCOUNT_PASSWORD - that account's password
#   FCM_SERVICE_ACCOUNT_KEY - full JSON content of a Firebase service
#                             account key (Project Settings > Service
#                             accounts > Generate new private key)

name: Push Notification Check

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch: {}

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for notifications
        env:
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          BACKUP_ACCOUNT_EMAIL: ${{ secrets.BACKUP_ACCOUNT_EMAIL }}
          BACKUP_ACCOUNT_PASSWORD: ${{ secrets.BACKUP_ACCOUNT_PASSWORD }}
          FCM_SERVICE_ACCOUNT_KEY: ${{ secrets.FCM_SERVICE_ACCOUNT_KEY }}
        run: node scripts/notify_check.mjs
