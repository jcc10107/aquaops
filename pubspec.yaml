name: aqua_ops
description: "AquaOps - Drink 8 Purified Water Refilling Station POS, Delivery & Inventory Management"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.6.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  firebase_core: ^4.15.0
  firebase_auth: ^6.7.0
  cloud_firestore: ^6.10.0
  provider: ^6.1.2
  intl: ^0.19.0
  google_fonts: ^8.2.1
  url_launcher: ^6.3.2
  image_picker: ^1.2.3
  http: ^1.2.0
  firebase_storage: ^13.6.0
  pdf: ^3.13.1
  printing: ^5.15.1
  firebase_app_check: ^0.4.8
  shared_preferences: ^2.2.3
  firebase_messaging: ^16.7.0
  web: ^1.1.1
  geolocator: ^13.0.1
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  connectivity_plus: ^6.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  assets:
    - assets/icon/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21
  # Water-drop icon on the app's primary blue — placeholder until a real
  # AquaOps logo is ready; swap assets/icon/app_icon.png and re-run
  # `dart run flutter_launcher_icons` to update.